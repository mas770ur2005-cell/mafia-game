#sky{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:linear-gradient(180deg,var(--bg1),var(--bg2))}
#sky .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
#sky .moon{position:absolute;top:120px;left:14px;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,#e8dcb0 60%,#c9bb86);box-shadow:0 0 60px 12px rgba(255,240,190,.25);transition:all 1.2s}
#sky .sun{position:absolute;top:-40px;left:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#fff6d0,#ffd27a 45%,rgba(255,170,80,0) 70%);opacity:0;transition:opacity 1.2s}
#sky .city{position:absolute;bottom:0;left:0;right:0;height:90px;opacity:.5}
body.day #sky .star{opacity:0!important;animation:none}
body.day #sky .moon{opacity:0;transform:translateY(60px)}
body.day #sky .sun{opacity:1}
body.day #sky .city{opacity:.18}
.wrap{max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom))}
.serif{font-family:'Amiri',serif}
.brand{text-align:center;padding:34px 0 10px}
.brand .t{font-family:'Amiri',serif;font-size:64px;line-height:1;color:var(--gold2);text-shadow:0 0 24px rgba(217,178,92,.35),0 3px 0 #4a2d05}
.brand .s{color:var(--mut);margin-top:10px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.card h3{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-inline-start:auto;font-size:13px;color:var(--mut);font-weight:600}
input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:inherit;font-size:16px;margin-bottom:10px;outline:none}
input:focus{border-color:var(--gold)}
button{font:inherit;font-weight:700;border-radius:14px;padding:12px 14px;cursor:pointer;background:var(--card2);color:var(--ink);border:1px solid var(--line);transition:transform .1s,background .2s}
button:active{transform:scale(.97)}
button.gold{background:linear-gradient(180deg,#f0cf7f,#c8952e);color:#2a1a02;border-color:#e6bf6a;box-shadow:0 6px 18px rgba(217,178,92,.3)}
button.red{background:linear-gradient(180deg,#e2455b,#a81f35);color:#fff;border-color:#e2455b}
button.full{width:100%}
button:disabled{opacity:.4;cursor:default;transform:none}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.mut{color:var(--mut);font-size:13px}
.err{background:rgba(198,47,69,.25);border:1px solid var(--blood);padding:10px 12px;border-radius:14px;margin-bottom:12px;font-size:14px}
/* top bar */
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.pill{padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap}
.top .sp{flex:1}
.ib{padding:7px 11px;border-radius:12px;font-size:14px}
/* hero */
.hero{text-align:center;padding:18px 10px 14px}
.hero .ttl{font-family:'Amiri',serif;font-size:38px;line-height:1.2;color:var(--gold2)}
.hero .st{color:var(--mut);font-size:14px;margin-top:4px}
.timer{display:inline-block;margin-top:10px;font-size:28px;font-weight:900;letter-spacing:2px;direction:ltr;padding:4px 18px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.timer.low{color:var(--blood2);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
/* table tokens */
.table{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.tok{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px 8px;border-radius:16px;border:1px solid transparent;transition:all .2s;text-align:center}
.tok.sel{cursor:pointer;background:var(--card2)}
.tok.sel:hover{border-color:var(--line)}
.tok.on{border-color:var(--gold);background:rgba(217,178,92,.14);box-shadow:0 0 0 1px var(--gold) inset}
.tok.dis{opacity:.35;cursor:default}
.av{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:22px;color:#fff;border:2px solid rgba(255,255,255,.18);box-shadow:0 4px 12px rgba(0,0,0,.25);position:relative}
.tok.dead .av{filter:grayscale(1) brightness(.55)}
.tok.dead .nm{text-decoration:line-through;opacity:.6}
.tok .nm{font-size:12.5px;font-weight:700;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.tok .rl{font-size:10.5px;color:var(--mut);line-height:1.1}
.tok .skull{position:absolute;top:22px;font-size:24px}
.tok .bd{position:absolute;top:4px;right:6px;font-size:15px}
.tok .bl{position:absolute;top:4px;left:6px;font-size:15px}
.tok .off{position:absolute;top:48px;right:20px;width:11px;height:11px;border-radius:50%;background:#777;border:2px solid var(--bg1)}
.tok .vc{position:absolute;top:2px;left:4px;min-width:24px;height:24px;border-radius:12px;background:var(--blood);color:#fff;font-size:13px;font-weight:900;display:grid;place-items:center;padding:0 6px;box-shadow:0 2px 8px rgba(198,47,69,.5)}
.tok .who{font-size:10px;color:var(--mut);line-height:1.2;max-height:24px;overflow:hidden}
.mk{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:99px;background:var(--blood);color:#fff}
.mk.g{background:var(--gold);color:#2a1a02}
/* role card */
.flip{perspective:1200px;width:240px;height:340px;margin:6px auto 14px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .9s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.back{background:
  repeating-linear-gradient(45deg,rgba(217,178,92,.12) 0 2px,transparent 2px 14px),
  repeating-linear-gradient(-45deg,rgba(217,178,92,.12) 0 2px,transparent 2px 14px),
  linear-gradient(160deg,#3a0d16,#160309);border:2px solid #b8893a;display:grid;place-items:center}
.back .emb{width:120px;height:120px;border-radius:50%;border:2px solid #d9b25c;display:grid;place-items:center;font-family:'Amiri',serif;font-size:44px;color:#f3d48a;background:rgba(0,0,0,.35);box-shadow:0 0 0 8px rgba(217,178,92,.12)}
.back .hint{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#f3d48a;font-size:13px;opacity:.85}
.front{transform:rotateY(180deg);background:linear-gradient(180deg,#fbf3df,#efe0bb);color:#2b1d12;border:2px solid #b8893a;display:flex;flex-direction:column;align-items:center;padding:16px 14px;text-align:center}
.front:before{content:'';position:absolute;inset:7px;border:1.5px solid rgba(160,110,30,.55);border-radius:12px;pointer-events:none}
.front .team{font-size:12px;font-weight:900;padding:3px 14px;border-radius:99px;color:#fff;margin-top:4px}
.front.m .team{background:#a81f35}.front.g .team{background:#2c8a58}
.front .ico{font-size:76px;margin:14px 0 4px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.2))}
.front .rn{font-family:'Amiri',serif;font-size:32px;line-height:1.2}
.front .sb{font-size:13px;color:#7a5a30;margin-top:-2px}
.front .ds{font-size:13px;line-height:1.6;margin-top:10px;color:#4a3826}
.mates{margin-top:6px;text-align:center}
.mates b{color:var(--blood2)}
/* overlay */
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(3,4,12,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .4s}
@keyframes fade{from{opacity:0}}
.ov .box{max-width:440px;width:100%;text-align:center}
.ov .big{font-family:'Amiri',serif;font-size:40px;color:#f3d48a;margin-bottom:16px;animation:rise .7s}
.ov .ln{font-size:18px;line-height:1.7;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 14px;margin:8px 0;opacity:0;animation:rise .6s forwards}
.ov .tap{color:#aab;margin-top:18px;font-size:13px;opacity:0;animation:rise .5s forwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:14px 6px;font-size:15px;color:var(--mut)}
.tabs button.on{color:var(--gold2)}
.tabs .n{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--blood);color:#fff;font-size:11px}
/* chat */
.chat{display:flex;flex-direction:column;gap:7px;height:calc(100vh - 260px);min-height:260px;overflow-y:auto;padding:4px 2px 10px}
.msg{max-width:84%;padding:8px 12px;border-radius:16px;font-size:14.5px;line-height:1.5;background:var(--card2);align-self:flex-start;word-wrap:break-word}
.msg.me{align-self:flex-end;background:rgba(217,178,92,.18)}
.msg b{display:block;font-size:11.5px;color:var(--mut)}
.msg.mafia{background:rgba(198,47,69,.2);border:1px solid rgba(198,47,69,.4)}
.msg.dead{background:rgba(140,140,170,.12);font-style:italic}
.msg.sys{align-self:center;background:none;color:var(--mut);font-size:12.5px;text-align:center;max-width:100%}
.chatbar{display:flex;gap:8px}.chatbar input{margin:0}
.note{font-size:13px;padding:8px 12px;border-radius:12px;background:var(--card2);margin-bottom:8px;text-align:center}
.note.red{background:rgba(198,47,69,.18);color:var(--blood2)}
/* misc */
.log .e{padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.6}
.log .e:last-child{border:0}
.log .rd{font-size:11px;color:var(--mut);font-weight:700}
.set{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);gap:8px}
.set:last-child{border:0}
.set .l{font-weight:700}.set .l small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.seg{display:flex;gap:4px}.seg button{padding:6px 10px;font-size:13px;border-radius:10px}
.seg button.on{background:var(--gold);color:#2a1a02;border-color:var(--gold)}
.sw{width:50px;height:28px;border-radius:99px;padding:0;position:relative;flex:0 0 50px;background:var(--card2)}
.sw:after{content:'';position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#888;transition:all .2s}
.sw.on{background:var(--good);border-color:var(--good)}.sw.on:after{right:25px;background:#fff}
.code{font-size:42px;font-weight:900;letter-spacing:8px;text-align:center;direction:ltr;color:var(--gold2);margin:2px 0 10px;font-family:'Cairo'}
.dist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dist span{font-size:12.5px;padding:4px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line)}
.dist span.m{border-color:rgba(198,47,69,.6)}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:30;max-width:90%;text-align:center}
.hidden{display:none!important}
.waitlist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.waitlist span{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--card2)}
.waitlist span.ok{background:rgba(47,174,110,.2)}
.rules p{margin:6px 0;font-size:14px;line-height:1.7}
.rules b{color:var(--gold2)}
</style>
</head>
<body>

<svg class="city" viewBox="0 0 400 120" preserveAspectRatio="none"><path fill="#05060d" d="M0 120V78h18V60h14v18h10V44h22v34h8V66h12V30l10-14 10 14v48h10V56h20v22h8V40h6V26h4v14h6v38h14V62h18v16h8V48l14-10 14 10v30h10V70h16V54h12v24h10V36h8l8-8 8 8v42h12V64h14v14h10V50h18v28h12V120z"/></svg></div>
<div class="wrap" id="app"></div>
<div class="tabs hidden" id="tabs">
  <button id="tGame" class="on" onclick="setTab('game')">🃏 الطاولة</button>
  <button id="tChat" onclick="setTab('chat')">💬 الدردشة <span id="unread"></span></button>
  <button id="tLog" onclick="setTab('log')">📜 الأحداث</button>
</div>
<div id="ovRoot"></div>
<div class="toast hidden" id="toast"></div>
<script>
// ======================= أدوات =======================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PREFIX = 'mafia-gz-room-';
const store = { get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} };
const rid = n => Array.from({length:n},()=> 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
let myPid = store.get('mafia_pid'); if(!myPid){ myPid = 'p'+rid(10); store.set('mafia_pid', myPid); }
const ICE = { config: { iceServers: [ {urls:'stun:stun.l.google.com:19302'}, {urls:'stun:stun1.l.google.com:19302'}, {urls:'stun:global.stun.twilio.com:3478'} ] } };
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.remove('hidden'); clearTimeout(toast.h); toast.h=setTimeout(()=>el.classList.add('hidden'),2600); }
function vib(p){ try{ navigator.vibrate && navigator.vibrate(p) }catch(e){} }
const COLORS=['#b23a48','#3a6ea5','#2a9d8f','#8e5ad6','#d17a22','#4f772d','#c2185b','#00838f','#6d4c41','#5c6bc0','#ad1457','#2e7d32','#ef6c00','#455a64'];
function colorOf(pid){ let h=0; for(const c of pid) h=(h*31+c.charCodeAt(0))>>>0; return COLORS[h%COLORS.length]; }
function initial(n){ return (String(n).trim()[0]||'؟'); }

// نجوم السما
(function(){ const sky=$('#sky'); for(let i=0;i<70;i++){ const s=document.createElement('div'); s.className='star'; s.style.top=(Math.random()*70)+'%'; s.style.left=(Math.random()*100)+'%'; s.style.animationDelay=(Math.random()*3)+'s'; if(Math.random()<.2){s.style.width=s.style.height='3px'} sky.appendChild(s);} })();

// ======================= أصوات =======================
let AC=null, soundOn = store.get('mafia_sound')!==false;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
document.addEventListener('pointerdown', ()=>ac(), {once:true});
function tone(f,dur,type,gain,delay,slide){ const a=ac(); if(!a||!soundOn) return; const t=a.currentTime+(delay||0); const o=a.createOscillator(), g=a.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(gain||.15,t+.03); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05); }
function noise(dur,gain,delay,lp){ const a=ac(); if(!a||!soundOn) return; const t=a.currentTime+(delay||0); const b=a.createBuffer(1,a.sampleRate*dur,a.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3); const s=a.createBufferSource(); s.buffer=b; const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp||3000; const g=a.createGain(); g.gain.value=gain||.5; s.connect(f).connect(g).connect(a.destination); s.start(t); }
const SFX={
  night(){ tone(196,1.6,'sine',.12,0,98); tone(147,2.2,'triangle',.08,.4,73); tone(880,.25,'sine',.04,1.4); tone(660,.35,'sine',.04,1.65); },
  day(){ [523,659,784,1047].forEach((f,i)=>tone(f,.9,'sine',.09,i*.14)); },
  death(){ tone(110,1.4,'sawtooth',.08,0,55); noise(.6,.25,0,400); },
  shot(){ noise(.35,.9,0,5000); noise(1.2,.25,.08,700); },
  card(){ noise(.12,.25,0,6000); tone(1200,.08,'triangle',.05,.05); },
  tick(){ tone(1000,.05,'square',.03); },
  vote(){ tone(520,.12,'triangle',.06); },
  win(){ [392,523,659,784,1047].forEach((f,i)=>tone(f,.7,'triangle',.08,i*.12)); },
  lose(){ [392,330,262,196].forEach((f,i)=>tone(f,.7,'sawtooth',.05,i*.18)); },
  reveal(){ [262,330,392,523].forEach((f,i)=>tone(f,.5,'triangle',.08,i*.08)); }
};

// ======================= الأدوار =======================
const ROLES = {
  boss:{n:'شيخ المافيا',i:'👑',t:'m',d:'إنت رأس المافيا. كل ليلة إنت الوحيد اللي بيقرّر مين ينغتال. خلّي وجهك بارد بالنهار.'},
  silencer:{n:'مافيا التسكيت',i:'🤐',t:'m',d:'كل ليلة بتختار واحد يكون ممنوع من الحكي طول النهار الجاي — وبتقدر تسكّت حالك كمان.'},
  mafia:{n:'مافيا',i:'🔪',t:'m',d:'إنت من المافيا. اكذب، شكّك، ودافع عن جماعتك. إذا مات الشيخ بتمسك إنت قرار الاغتيال.'},
  mayor:{n:'شيخ الصالحين',sub:'العمدة',i:'🏛️',t:'g',d:'بالنهار بتقدر تكشف كرتك قدّام الكل وتضل باللعبة، وبعدها صوتك بيصير بـ3 أصوات. بس انتبه… المافيا رح تعرفك.'},
  son:{n:'الولد الصالح',i:'😇',t:'g',d:'إذا طلعت من اللعبة بأي طريقة، بتسحب معك واحد إنت بتختاره. اختار صح!'},
  medic:{n:'الإسعاف',i:'🚑',t:'g',d:'كل ليلة توقّع مين رح تغتاله المافيا. إذا صح توقعك، بتنقذ حياته.'},
  sniper:{n:'القنّاص',i:'🎯',t:'g',d:'معك رصاصة وحدة باللعبة كلها، بتطلقها بالليل بالسر. إذا صابت مافيا بيطلع… وإذا صابت صالح بتطلعوا إنتو الاثنين.'},
  citizen:{n:'مواطن صالح',i:'🙂',t:'g',d:'ما عندك قدرة خاصة، بس عقلك هو سلاحك. ركّز بالنقاش واكشف المافيا بالتصويت.'}
};
const isM = r => !!r && ROLES[r].t==='m';

// ======================= منطق المضيف =======================
let H=null, conns={}, peer=null, hostConn=null, V=null, isHost=false, roomCode=null, hostTick=null;

function newState(code){
  return { code, host: myPid, phase:'lobby', round:0, players:[],
    settings:{mafia:0, silencer:true, mayor:true, son:true, medic:true, sniper:true, reveal:true, talk:180, vote:90},
    night:{}, votes:{}, stage:null, endAt:0, silenced:null, mayorRevealed:false, revQ:[], revenge:null,
    log:[], chat:[], winner:null, ann:null, annN:0 };
}
const P = pid => H.players.find(p=>p.pid===pid);
const live = () => H.players.filter(p=>p.alive && !p.spec);
const autoMafia = n => n>=11 ? 3 : n>=7 ? 2 : 1;
const roleTxt = p => H.settings.reveal ? ` — وكان <${ROLES[p.role].i} ${ROLES[p.role].n}>` : '';
function addLog(t){ H.log.unshift({t, r:H.round}); if(H.log.length>80) H.log.pop(); }
function sysChat(t){ H.chat.push({ch:'all', sys:true, text:t, ts:Date.now()}); if(H.chat.length>250) H.chat.splice(0,H.chat.length-250); }
function announce(kind, title, lines){ H.annN++; H.ann={id:H.code+'-'+H.annN, kind, title, lines}; lines.forEach(l=>addLog(l)); }
function killer(){ const a=live(); return a.find(p=>p.role==='boss') || a.find(p=>p.role==='mafia') || a.find(p=>p.role==='silencer') || null; }

function hostHandle(pid, m){
  const me = P(pid);
  switch(m.t){
    case 'join': {
      const name = String(m.name||'لاعب').replace(/\s+/g,' ').trim().slice(0,18) || 'لاعب';
      if(me){ me.name=name; me.connected=true; }
      else { const spec = H.phase!=='lobby'; H.players.push({pid, name, alive:!spec, role:null, connected:true, spec});
        sysChat(spec ? `${name} دخل يتفرّج 👀` : `${name} قعد على الطاولة 👋`); }
      break;
    }
    case 'leave': if(me){ me.connected=false; if(H.phase==='lobby' && pid!==H.host){ H.players=H.players.filter(p=>p.pid!==pid); sysChat(`${me.name} طلع من الغرفة`);} } break;
    case 'chat': {
      if(!me) return; const text=String(m.text||'').trim().slice(0,300); if(!text) return;
      let ch='all';
      if(me.spec || !me.alive) ch = (H.phase==='lobby'||H.phase==='over') ? 'all' : 'dead';
      else if(H.phase==='night' || H.phase==='intro'){ if(isM(me.role)) ch='mafia'; else return; }
      else if(H.phase==='day' && H.silenced===pid) return;
      H.chat.push({ch, from:pid, name:me.name, text, ts:Date.now()}); if(H.chat.length>250) H.chat.splice(0,H.chat.length-250);
      break;
    }
    case 'ready': if(H.phase==='intro' && me && !me.spec){ me.ready=true; if(live().every(p=>p.ready)) startDay(true); } break;
    case 'act': {
      if(H.phase!=='night' || !me || !me.alive || me.spec) return;
      const k=m.kind, tg = m.target==='none' ? null : P(m.target);
      if(m.target!=='none' && (!tg || !tg.alive || tg.spec)) return;
      if(k==='kill'){ if(killer()!==me || !tg || isM(tg.role)) return; H.night.kill=tg.pid; }
      else if(k==='silence'){ if(me.role!=='silencer' || !tg) return; H.night.silence=tg.pid; }
      else if(k==='save'){ if(me.role!=='medic' || !tg) return; H.night.save=tg.pid; }
      else if(k==='shot'){ if(me.role!=='sniper' || !me.bullet) return; if(tg && tg.pid===pid) return; H.night.shot = tg ? tg.pid : 'none'; }
      else return;
      if(nightDone()) endNight();
      break;
    }
    case 'vote': {
      if(H.phase!=='day' || H.stage!=='vote' || !me || !me.alive || me.spec) return;
      const tg=P(m.target); if(!tg || !tg.alive || tg.spec || tg.pid===pid) return;
      H.votes[pid]=tg.pid;
      if(live().every(p=>H.votes[p.pid])) endDay();
      break;
    }
    case 'reveal': {
      if(H.phase!=='day' || !me || me.role!=='mayor' || !me.alive || H.mayorRevealed) return;
      H.mayorRevealed=true; me.pub=true;
      announce('reveal','🏛️ كشف الكرت!', [`${me.name} كشف كرته… هو <🏛️ شيخ الصالحين>! من هلأ صوته بـ3 أصوات`]);
      break;
    }
    case 'revenge': {
      if(H.phase!=='revenge' || !H.revenge || H.revenge.pid!==pid) return;
      const tg=P(m.target); if(!tg || !tg.alive || tg.spec) return;
      const next=H.revenge.next; H.revenge=null;
      kill(tg.pid);
      announce('death','😇 انتقام الولد الصالح', [`${me.name} سحب معه ${tg.name} برّا اللعبة${roleTxt(tg)}`]);
      proceed(next);
      break;
    }
    // ---- أوامر المضيف ----
    case 'settings': if(pid!==H.host || H.phase!=='lobby') return; Object.assign(H.settings, m.s||{}); break;
    case 'start': if(pid!==H.host || H.phase!=='lobby') return; startGame(); break;
    case 'force':
      if(pid!==H.host) return;
      if(H.phase==='intro') startDay(true);
      else if(H.phase==='night') endNight();
      else if(H.phase==='day' && H.stage==='talk') toVote();
      else if(H.phase==='day') endDay();
      else if(H.phase==='revenge'){ const n=H.revenge.next; announce('info','😇',[`${P(H.revenge.pid).name} ما اختار حدا يسحبه`]); H.revenge=null; proceed(n); }
      break;
    case 'lobby': if(pid!==H.host) return; backToLobby(); break;
    case 'kick': if(pid!==H.host || H.phase!=='lobby' || m.target===H.host) return;
      H.players=H.players.filter(p=>p.pid!==m.target); if(conns[m.target]) try{conns[m.target].send({t:'kicked'})}catch(e){} break;
    case 'ackann': return;
  }
  broadcast();
}

function distribution(n){
  const s=H.settings;
  let nm = s.mafia || autoMafia(n); nm = Math.max(1, Math.min(nm, Math.ceil(n/2)-1));
  const roles=['boss']; if(nm>1) roles.push(s.silencer?'silencer':'mafia'); while(roles.length<nm) roles.push('mafia');
  const town=[]; ['mayor','son','medic','sniper'].forEach(r=>{ if(s[r]) town.push(r); });
  const slots=n-nm; while(town.length>slots) town.pop(); while(town.length<slots) town.push('citizen');
  return roles.concat(town);
}
function startGame(){
  H.players=H.players.filter(p=>p.connected||p.pid===H.host);
  const ps=H.players; ps.forEach(p=>p.spec=false);
  if(ps.length<4){ if(isHost) toast('لازم 4 لاعبين على الأقل'); return; }
  const roles=distribution(ps.length);
  for(let i=roles.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [roles[i],roles[j]]=[roles[j],roles[i]]; }
  ps.forEach((p,i)=>{ Object.assign(p,{role:roles[i], alive:true, ready:false, pub:false, bullet:roles[i]==='sniper', revUsed:false}); });
  Object.assign(H,{round:0, phase:'intro', log:[], votes:{}, silenced:null, mayorRevealed:false, revQ:[], revenge:null, winner:null, night:{}, stage:null});
  H.chat=H.chat.filter(c=>c.ch==='all').slice(-15);
  const nm=roles.filter(isM).length;
  sysChat(`🃏 انسحبت الكروت — ${ps.length} لاعبين، بينهم ${nm} مافيا`);
  announce('night','🌙 التغميض', ['انسحبت الكروت… كل واحد يشوف كرته بالسر','المافيا فتّحت عيونها وتعرّفت على بعضها 👀']);
}
function startDay(first){
  H.phase='day'; H.votes={}; H.revenge=null;
  if(first){ H.round=1; announce('day','☀️ طلع أول صبح', ['ما حدا مات… بس المافيا صارت تعرف بعضها','ابدأوا النقاش — مين شكله مش مريح؟']); }
  sysChat(`☀️ اليوم ${H.round} — صحيت المدينة`);
  const t=+H.settings.talk||0;
  if(t>0){ H.stage='talk'; H.endAt=Date.now()+t*1000; } else toVote(true);
}
function toVote(silent){
  H.stage='vote'; H.votes={};
  const t=+H.settings.vote||0; H.endAt = t>0 ? Date.now()+t*1000 : 0;
  if(!silent) sysChat('🗳️ خلص النقاش — صار وقت التصويت');
}
function startNight(){
  H.round++; H.phase='night'; H.stage=null; H.night={}; H.silenced=null; H.votes={}; H.endAt=0;
  sysChat(`🌙 الليلة ${H.round} — المدينة نامت`);
}
function nightDone(){
  const a=live(), k=killer();
  if(k && !H.night.kill) return false;
  if(a.some(p=>p.role==='silencer') && !H.night.silence) return false;
  if(a.some(p=>p.role==='medic') && !H.night.save) return false;
  if(a.some(p=>p.role==='sniper' && p.bullet) && !H.night.shot) return false;
  return true;
}
function kill(pid){
  const p=P(pid); if(!p || !p.alive) return false;
  p.alive=false; delete H.votes[pid]; for(const k in H.votes) if(H.votes[k]===pid) delete H.votes[k];
  if(H.silenced===pid) H.silenced=null;
  if(p.role==='son' && !p.revUsed){ p.revUsed=true; H.revQ.push(pid); }
  return true;
}
function endNight(){
  const N=H.night, lines=[]; let deaths=0, shotFired=false;
  // القنّاص
  const sn=H.players.find(p=>p.role==='sniper' && p.bullet && p.alive);
  if(sn && N.shot && N.shot!=='none'){
    sn.bullet=false; shotFired=true; const tg=P(N.shot);
    if(tg && tg.alive){
      if(isM(tg.role)){ kill(tg.pid); deaths++; lines.push(`🎯 انسمع صوت رصاصة بنص الليل… ${tg.name} انقنص${roleTxt(tg)}`); }
      else { kill(tg.pid); kill(sn.pid); deaths+=2; lines.push(`🎯 انسمع صوت رصاصة… بس القنّاص غلط! طلع ${tg.name}${roleTxt(tg)}، وطلع معه القنّاص ${sn.name}`); }
    }
  }
  // الاغتيال
  if(N.kill){
    const v=P(N.kill);
    if(v && v.alive){
      if(N.save===N.kill){ lines.push('🚑 المافيا حاولت تغتال حدا… بس الإسعاف وصل بالوقت وأنقذه!'); }
      else { kill(v.pid); deaths++; lines.push(`💀 ${v.name} انغتال الليلة${roleTxt(v)}`); }
    }
  } else lines.push('ليلة هادية… المافيا ما اغتالت حدا');
  // التسكيت
  if(N.silence){ const s=P(N.silence); if(s && s.alive){ H.silenced=s.pid; lines.push(`🤐 ${s.name} مسكّت اليوم — ممنوع يحكي ولا كلمة`); } }
  if(!deaths && !shotFired && N.kill && N.save===N.kill) {}
  announce(deaths? (shotFired?'shot':'death') : 'day', `☀️ صباح اليوم ${H.round}`, lines);
  proceed('day');
}
function endDay(){
  const w = pid => (P(pid).role==='mayor' && H.mayorRevealed) ? 3 : 1;
  const cnt={}; for(const [v,t] of Object.entries(H.votes)){ if(P(v)&&P(v).alive) cnt[t]=(cnt[t]||0)+w(v); }
  let max=0,tops=[]; for(const [k,v] of Object.entries(cnt)){ if(v>max){max=v;tops=[k]} else if(v===max) tops.push(k); }
  let lines;
  if(!tops.length) lines=['🤷 ما حدا صوّت… ما حدا طلع'];
  else if(tops.length>1) lines=[`⚖️ تعادل بالأصوات بين ${tops.map(t=>P(t).name).join(' و ')}… ما حدا طلع`];
  else { const v=P(tops[0]); kill(v.pid); lines=[`🗳️ الأغلبية حكمت… ${v.name} طلع من اللعبة بـ${max} ${max>2&&max<11?'أصوات':'صوت'}${roleTxt(v)}`]; }
  announce(tops.length===1?'death':'info','🗳️ نتيجة التصويت', lines);
  proceed('night');
}
function proceed(next){
  const a=live(), m=a.filter(p=>isM(p.role)).length, g=a.length-m;
  if(m===0) return finish('town');
  if(H.revQ.length){ const pid=H.revQ.shift(); H.phase='revenge'; H.revenge={pid,next}; H.stage=null; H.endAt=0; return; }
  if(m>=g) return finish('mafia');
  if(next==='day') startDay(false); else startNight();
}
function finish(w){
  H.winner=w; H.phase='over'; H.stage=null; H.endAt=0;
  announce(w==='town'?'win':'lose', w==='town'?'🎉 الصالحين فازوا!':'🔪 المافيا فازت!', [w==='town'?'المدينة نظفت… كل المافيا طلعوا':'المافيا سيطرت على المدينة… صار عددهم قد الصالحين']);
  sysChat('🏁 انتهت اللعبة');
}
function backToLobby(){
  Object.assign(H,{phase:'lobby', round:0, winner:null, votes:{}, night:{}, log:[], stage:null, endAt:0, silenced:null, mayorRevealed:false, revQ:[], revenge:null, ann:null});
  H.players=H.players.filter(p=>p.connected||p.pid===H.host);
  H.players.forEach(p=>Object.assign(p,{role:null, alive:true, spec:false, ready:false, pub:false}));
}
function hostTimer(){
  clearInterval(hostTick);
  hostTick=setInterval(()=>{ if(!H || !H.endAt || Date.now()<H.endAt) return;
    if(H.phase==='day' && H.stage==='talk'){ toVote(); broadcast(); }
    else if(H.phase==='day' && H.stage==='vote'){ endDay(); broadcast(); } },500);
}

function viewFor(pid){
  const me=P(pid)||{pid,spec:true,alive:false}, over=H.phase==='over', amM=isM(me.role);
  const players=H.players.map(p=>({ pid:p.pid, name:p.name, alive:p.alive, spec:p.spec, connected: p.pid===H.host?true:!!p.connected, ready:!!p.ready, pub:!!p.pub,
    role: (p.pid===pid || over || (!p.alive && H.settings.reveal && !p.spec) || (amM && isM(p.role)) || p.pub) ? p.role : null }));
  const k=killer();
  let night=null;
  if(H.phase==='night' && me.alive){
    night={ isKiller: k && k.pid===pid, kill: amM?H.night.kill||null:null, silence: amM?H.night.silence||null:null,
      save: me.role==='medic'?H.night.save||null:null, shot: me.role==='sniper'?H.night.shot||null:null, killerName: amM&&k?k.name:null };
  }
  const canSee = c => c.ch==='all' || (c.ch==='mafia' && (amM||over)) || (c.ch==='dead' && (!me.alive||me.spec||over));
  let waiting=[];
  if(H.phase==='intro') waiting=live().map(p=>({n:p.name,ok:!!p.ready}));
  return { code:H.code, host:H.host, me:pid, phase:H.phase, stage:H.stage, round:H.round, players, settings:H.settings,
    myRole:me.role||null, myAlive:!!me.alive && !me.spec, spec:!!me.spec, myReady:!!me.ready, bullet:!!me.bullet,
    night, votes: H.phase==='day'?H.votes:{}, mayorRevealed:H.mayorRevealed, silenced:H.silenced,
    revenge:H.revenge?H.revenge.pid:null, log:H.log.slice(0,50), chat:H.chat.filter(canSee).slice(-120), winner:H.winner,
    ann:H.ann, left: H.endAt? Math.max(0,H.endAt-Date.now()) : null,
    pending: H.phase==='night' ? nightPending() : H.phase==='day'&&H.stage==='vote' ? live().filter(p=>!H.votes[p.pid]).length : 0, waiting,
    dist: H.phase==='lobby' ? distribution(Math.max(4,H.players.length)) : null };
}
function nightPending(){ const a=live(); let n=0; if(killer()&&!H.night.kill) n++; if(a.some(p=>p.role==='silencer')&&!H.night.silence) n++;
  if(a.some(p=>p.role==='medic')&&!H.night.save) n++; if(a.some(p=>p.role==='sniper'&&p.bullet)&&!H.night.shot) n++; return n; }

function broadcast(){
  store.set('mafia_host', H);
  for(const [pid,c] of Object.entries(conns)) if(c.open) try{ c.send({t:'view', v:viewFor(pid)}); }catch(e){}
  onView(viewFor(myPid));
}
</script>
<script>
// ======================= الشبكة =======================
function createRoom(name, resume){
  if(!window.Peer){ errMsg='مكتبة الاتصال ما تحمّلت. تأكد من الإنترنت وحدّث الصفحة.'; renderHome(); return; }
  isHost=true;
  if(resume){ H=resume; roomCode=H.code; const me=P(myPid); if(me) me.name=name; }
  else { roomCode=rid(5); H=newState(roomCode); H.players.push({pid:myPid, name, alive:true, role:null, connected:true, spec:false}); }
  store.set('mafia_name', name); hostTimer();
  status('جاري تجهيز الطاولة…');
  let tries=0;
  const open=()=>{
    peer=new Peer(PREFIX+roomCode, ICE);
    peer.on('open', ()=>broadcast());
    peer.on('connection', c=>{
      c.on('data', m=>{
        if(!m || typeof m!=='object') return;
        const pid=String(m.pid||'').replace(/[^A-Za-z0-9]/g,'').slice(0,40); if(!pid) return;
        if(m.t==='join'){ if(conns[pid] && conns[pid]!==c) try{conns[pid].close()}catch(e){} conns[pid]=c; c._pid=pid; }
        if(c._pid!==pid) return;
        hostHandle(pid, m);
      });
      c.on('close', ()=>{ if(c._pid && conns[c._pid]===c){ delete conns[c._pid]; const p=P(c._pid); if(p){ p.connected=false; broadcast(); } } });
    });
    peer.on('error', e=>{
      if(e.type==='unavailable-id' && tries<6){ tries++; status('الغرفة لسا محجوزة، بحاول كمان مرة…'); try{peer.destroy()}catch(x){} setTimeout(open,3000); return; }
      if(e.type==='unavailable-id' && !resume){ roomCode=rid(5); H.code=roomCode; tries=0; try{peer.destroy()}catch(x){} open(); return; }
      if(['network','server-error','socket-error','socket-closed'].includes(e.type)) toast('مشكلة بالاتصال… بحاول أرجع');
    });
    peer.on('disconnected', ()=>setTimeout(()=>{ try{ if(!peer.destroyed) peer.reconnect(); }catch(e){} },2000));
  };
  open();
}
function joinRoom(name, code){
  if(!window.Peer){ errMsg='مكتبة الاتصال ما تحمّلت. تأكد من الإنترنت وحدّث الصفحة.'; renderHome(); return; }
  code=String(code).toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length<4){ errMsg='اكتب كود الغرفة صح'; renderHome(); return; }
  isHost=false; roomCode=code; store.set('mafia_name',name); store.set('mafia_join',{code,name});
  status('جاري الاتصال بالطاولة…');
  if(peer) try{peer.destroy()}catch(e){}
  peer=new Peer(undefined, ICE);
  peer.on('open', ()=>connectHost(name));
  peer.on('error', e=>{
    if(e.type==='peer-unavailable'){ if(V) lostHost(); else { errMsg='ما في غرفة بهالكود، أو المضيف مسكّر الصفحة'; store.del('mafia_join'); renderHome(); } }
    else if(!V){ errMsg='ما قدرت أتصل 😕 ('+e.type+')'; renderHome(); }
  });
  peer.on('disconnected', ()=>setTimeout(()=>{ try{ if(!peer.destroyed) peer.reconnect(); }catch(e){} },2000));
}
function connectHost(name){
  hostConn=peer.connect(PREFIX+roomCode, {reliable:true});
  const to=setTimeout(()=>{ if(!hostConn.open){ if(V) lostHost(); else { errMsg='الاتصال طوّل كثير. ممكن الشبكة بتمنع الاتصال المباشر — جرّب واي فاي أو شبكة ثانية.'; renderHome(); } } },15000);
  hostConn.on('open', ()=>{ clearTimeout(to); hostConn.send({t:'join', pid:myPid, name}); });
  hostConn.on('data', m=>{
    if(m && m.t==='view') onView(m.v);
    if(m && m.t==='kicked'){ store.del('mafia_join'); V=null; try{peer.destroy()}catch(e){} errMsg='المضيف طلّعك من الغرفة'; renderHome(); }
  });
  hostConn.on('close', ()=>{ if(V) lostHost(); });
}
let lostTimer=null;
function lostHost(){ toast('انقطع الاتصال بالمضيف… بحاول أرجع'); clearTimeout(lostTimer);
  lostTimer=setTimeout(()=>{ if(peer && !peer.destroyed && (!hostConn||!hostConn.open)) connectHost(store.get('mafia_name')||'لاعب'); },3000); }
function send(m){ m.pid=myPid; if(isHost) hostHandle(myPid,m); else if(hostConn && hostConn.open) hostConn.send(m); else toast('مش متصل بالمضيف'); }
function leaveRoom(){
  if(isHost){ store.del('mafia_host'); clearInterval(hostTick); for(const c of Object.values(conns)) try{c.close()}catch(e){} }
  else { try{ send({t:'leave'}) }catch(e){} store.del('mafia_join'); }
  try{ peer && peer.destroy() }catch(e){}
  peer=null; H=null; V=null; conns={}; isHost=false; hostConn=null; seenAnn=null;
  $('#tabs').classList.add('hidden'); document.body.classList.remove('day'); $('#ovRoot').innerHTML='';
  renderHome();
}
</script>
<script>
// ======================= الواجهة =======================
let tab='game', seenChat=0, errMsg='', seenAnn=store.get('mafia_seen_ann'), sel=null, cardOpen=false, recvAt=0, confirmLeave=false;
function status(t){ $('#app').innerHTML=`<div class="brand"><div class="t">مافيا</div></div><div class="card" style="text-align:center">${esc(t)}<br><br><button onclick="leaveRoom()">إلغاء</button></div>`; }
const rich = s => esc(s).replace(/&lt;(.+?)&gt;/g,'<b style="color:var(--gold2)">$1</b>');

function renderHome(){
  const name=store.get('mafia_name')||'', url=(new URLSearchParams(location.search).get('room')||'').toUpperCase();
  const saved=store.get('mafia_host'), sj=store.get('mafia_join');
  document.body.classList.remove('day');
  $('#app').innerHTML=`
  <div class="brand"><div class="t">مافيا</div><div class="s">ليلة في المدينة… مين فيكم المافيا؟</div></div>
  ${errMsg?`<div class="err">${esc(errMsg)}</div>`:''}
  <div class="card">
    <h3>👤 اسمك على الطاولة</h3>
    <input id="nm" maxlength="18" placeholder="اكتب اسمك" value="${esc(name)}">
    ${saved&&saved.code?`<button class="full" style="margin-bottom:8px" onclick="go('resume')">↩️ رجّع غرفتك <b dir="ltr">${esc(saved.code)}</b></button>`:''}
    ${sj&&!url?`<button class="full" style="margin-bottom:8px" onclick="go('rejoin')">↩️ ارجع لغرفة <b dir="ltr">${esc(sj.code)}</b></button>`:''}
    <button class="gold full" onclick="go('create')">🃏 افتح طاولة جديدة</button>
  </div>
  <div class="card">
    <h3>🚪 ادخل طاولة صاحبك</h3>
    <input id="cd" maxlength="6" placeholder="كود الغرفة" style="direction:ltr;text-align:center;letter-spacing:6px;text-transform:uppercase;font-weight:800" value="${esc(url)}">
    <button class="full" id="joinBtn" onclick="go('join')">ادخل الغرفة</button>
  </div>

function go(kind){
  const name=($('#nm').value||'').trim();
  if(!name){ errMsg='اكتب اسمك أول 🙂'; renderHome(); return; }
  ac();
  if(kind==='create'){ store.del('mafia_host'); createRoom(name); }
  else if(kind==='resume') createRoom(name, store.get('mafia_host'));
  else if(kind==='rejoin') joinRoom(name, store.get('mafia_join').code);

function onView(v){

  if(prev && prev.phase!==v.phase){ if(v.phase==='night') SFX.night(); vib(150); cardOpen=false; }
  if(prev && prev.stage!=='vote' && v.stage==='vote'){ SFX.vote(); vib([80,60,80]); }

function render(){
  if(!V) return;

function token(p, o){

  return `<div class="${cls}" ${o.click&&!o.dis?`onclick="${o.click}"`:''}>
    <div class="av" style="background:${colorOf(p.pid)}">${esc(initial(p.name))}</div>

    ${p.pub&&!dead?`<div class="bd">${role?role.i:''}</div>`:''}

  else if(V.phase==='day'){ ttl= V.stage==='talk'?'وقت النقاش':'وقت التصويت'; st= V.stage==='talk'?'احكوا، شكّكوا، ودافعوا عن حالكم':(V.pending?`باقي ${V.pending} ما صوّتوا`:''); }

  $('#app').innerHTML = topBar()+heroHTML()+main+act+table+last+force+`<button class="full" style="margin-top:10px" onclick="leaveAsk()">🚪 اطلع</button>`;

function pickCard(kind, title, cur, filter, hint, allowNone){
  const list=living().filter(filter);
  const chosen = sel && sel.kind===kind ? sel.pid : null;
  const shown = chosen || cur;
  const done = cur && !chosen;
  return `<div class="card"><h3>${title}</h3>
    <div class="table">${list.map(p=>token(p,{click:`pick('${kind}','${p.pid}')`, on: shown===p.pid})).join('')}</div>
    ${hint?`<p class="mut" style="margin:10px 0 0">${hint}</p>`:''}
    <div class="row" style="margin-top:10px">
      ${allowNone?`<button class="${cur==='none'?'gold':''}" onclick="sel=null;send({t:'act',kind:'shot',target:'none'})">مش الليلة</button>`:''}
      <button class="${kind==='kill'||kind==='shot'||kind==='revenge'?'red':'gold'}" ${chosen?'':'disabled'} onclick="confirmPick()">${done?'✔ تم — بتقدر تغيّر':chosen?'تأكيد: '+esc(nameOf(chosen)):'اختار لاعب'}</button>
    </div></div>`;
}
function pick(kind,pid){ sel={kind,pid}; SFX.tick(); render(); }
function confirmPick(){ if(!sel) return; const s=sel; sel=null;
  if(s.kind==='revenge') send({t:'revenge',target:s.pid}); else send({t:'act',kind:s.kind,target:s.pid});
  if(s.kind==='shot') SFX.shot(); else SFX.card(); }

function renderChat(){
  let note='', canSend=true;
  const alive=V.myAlive, inGame=!['lobby','over'].includes(V.phase);
  if(inGame && (!alive||V.spec)) note='👻 إنت برّا اللعبة — رسايلك بتوصل للي برّا بس';
  else if(inGame && (V.phase==='night'||V.phase==='intro')){ if(isM(V.myRole)) note='🔪 دردشة سرية — المافيا بس بيشوفوها'; else { note='🤫 الليل… ممنوع الحكي'; canSend=false; } }
  else if(V.phase==='day' && V.silenced===V.me){ note='🤐 إنت مسكّت اليوم'; canSend=false; }
  const box=$('#chatBox'), ci0=$('#ci');
  if(box && ci0 && ci0.disabled===!canSend && renderChat.note===note){ const atB=box.scrollHeight-box.scrollTop-box.clientHeight<60; box.innerHTML=chatItems(); if(atB) box.scrollTop=box.scrollHeight; return; }
  renderChat.note=note;
  $('#app').innerHTML=`${topBar()}<div class="card">
    ${note?`<div class="note ${note.includes('🔪')||note.includes('🤐')?'red':''}">${note}</div>`:''}
    <div class="chat" id="chatBox">${chatItems()}</div>
    <form class="chatbar" onsubmit="event.preventDefault();sendChat()"><input id="ci" maxlength="300" autocomplete="off" placeholder="${canSend?'اكتب رسالة…':'ممنوع الحكي هلأ'}" ${canSend?'':'disabled'}><button class="gold" style="flex:0 0 auto" ${canSend?'':'disabled'}>إرسال</button></form></div>`;
  const ci=$('#ci'); ci.value=draft; ci.oninput=()=>draft=ci.value;
  const b=$('#chatBox'); b.scrollTop=b.scrollHeight;
}
function sendChat(){ const t=($('#ci').value||'').trim(); if(!t) return; draft=''; $('#ci').value=''; send({t:'chat',text:t}); }
function renderLog(){
  $('#app').innerHTML=`${topBar()}<div class="card log"><h3>📜 كل الأحداث</h3>${V.log.map(l=>`<div class="e"><div class="rd">${l.r?'الجولة '+l.r:'البداية'}</div>${rich(l.t)}</div>`).join('')||'<div class="mut">لسا ما صار إشي</div>'}</div>`;
}
setInterval(()=>{ const t=$('#tmr'); if(!t||!V||V.left==null) return; const left=Math.max(0,V.left-(Date.now()-recvAt)); t.textContent=fmt(left); t.classList.toggle('low',left<15000); if(left<=10000&&left>0&&Math.ceil(left/1000)!==setInterval.l){ setInterval.l=Math.ceil(left/1000); SFX.tick(); } },250);

renderHome();
window.addEventListener('beforeunload', ()=>{ if(!isHost && hostConn && hostConn.open) try{hostConn.send({t:'leave',pid:myPid})}catch(e){} });
</script>
</body>
